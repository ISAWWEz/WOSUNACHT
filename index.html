<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOSUNACHT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
}

.container {
    margin-top: 100px;
}

h1 {
    font-size: 50px;
    color: #00ff88;
}

p {
    font-size: 18px;
    opacity: 0.8;
}

.button {
    margin-top: 30px;
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #00ff88;
    color: black;
    cursor: pointer;
    transition: 0.3s;
}

.button:hover {
    background: #00cc6a;
    transform: scale(1.05);
}

.footer {
    position: fixed;
    bottom: 10px;
    width: 100%;
    font-size: 12px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="container">
    <h1>WOSUNACHT</h1>
    <p>Numarasız ve e-mailsiz güvenli sohbet deneyimi</p>

    <button class="button" onclick="alert('Yakında aktif olacak!')">
        Sohbete Başla
    </button>
</div>

<div class="footer">
    © 2026 WOSUNACHT
</div>

</body>
</html>
