<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wosunacth</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111b21; color: #e9edef; margin: 0; display: flex; justify-content: center; height: 100vh; }
        #app { width: 100%; max-width: 450px; background: #222e35; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        .screen { display: none; flex-direction: column; height: 100%; }
        .active { display: flex; }

        #splash-screen { background: #111b21; align-items: center; justify-content: center; text-align: center; }
        #splash-screen img { width: 150px; height: 150px; border-radius: 20px; margin-bottom: 20px; }

        header { background: #202c33; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #313d45; }
        .btn { background: #00a884; color: #111b21; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ea0038; color: white; }

        .search-box { padding: 10px; background: #111b21; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; background: #2a3942; border: none; color: white; border-radius: 8px; box-sizing: border-box; outline: none; }

        .list-container { flex: 1; overflow-y: auto; }
        .item { padding: 15px; border-bottom: 1px solid #313d45; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .item:hover { background: #2c3943; }
        .id-text { font-size: 11px; color: #8696a0; }

        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; background-color: #0b141a; display: flex; flex-direction: column; }
        .bubble { padding: 8px 12px; border-radius: 8px; margin: 5px 0; max-width: 70%; word-wrap: break-word; font-size: 14px; }
        .sent { background: #005c4b; align-self: flex-end; }
        .received { background: #202c33; align-self: flex-start; }

        .stories { display: flex; padding: 10px; gap: 10px; overflow-x: auto; background: #111b21; border-bottom: 1px solid #313d45; }
        .story-circle { min-width: 55px; height: 55px; border-radius: 50%; border: 2px solid #00a884; display: flex; align-items: center; justify-content: center; font-size: 10px; text-align: center; cursor: pointer; background-size: cover; background-position: center; overflow: hidden; position: relative; }
        
        .settings-icon { font-size: 20px; cursor: pointer; color: #8696a0; }
        .more-icon { padding: 10px; color: #00a884; font-weight: bold; cursor: pointer; font-size: 18px; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 10px; background: #313d45; }
        .story-overlay { position: absolute; bottom: 0; background: rgba(0,0,0,0.5); width: 100%; font-size: 8px; padding: 2px 0; }
        .file-input { display: none; }

        /* Modal / Menü Stili */
        #friend-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content { background: #222e35; padding: 25px; border-radius: 15px; width: 80%; max-width: 300px; text-align: center; }
        .modal-content button { width: 100%; margin: 8px 0; height: 40px; }
    </style>
</head>
<body>

<div id="app">
    <div id="friend-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0; color:#00a884;">Kişi İşlemleri</h3>
            <button class="btn" onclick="modalRename()">Yeniden Adlandır</button>
            <button id="block-btn" class="btn btn-danger" onclick="modalToggleBlock()">Engelle</button>
            <button class="btn" style="background:#313d45; color:white;" onclick="closeModal()">İptal</button>
        </div>
    </div>

    <div id="splash-screen" class="screen active">
        <img src="acilis.webp" alt="Wosunacth Logo">
        <h1 style="color:#00a884;">Wosunacth</h1>
        <p style="color:#8696a0;">Yükleniyor...</p>
    </div>

    <div id="login-screen" class="screen">
        <div style="padding: 40px; text-align: center; margin-top: auto; margin-bottom: auto;">
            <h1 style="color:#00a884; font-size: 40px;">Wosunacth</h1>
            <p>10 haneli numaranızı belirleyin</p>
            <input type="number" id="my-number" placeholder="5xxxxxxxxx" oninput="if(this.value.length > 10) this.value = this.value.slice(0,10);">
            <button class="btn" style="margin-top: 20px; width: 100%; height: 45px;" onclick="startApp()">Giriş Yap</button>
        </div>
    </div>

    <div id="settings-screen" class="screen">
        <header>
            <button class="btn" onclick="showScreen('main-screen')">←</button>
            <span>Profil Ayarları</span>
            <span></span>
        </header>
        <div style="padding: 20px; text-align: center;">
            <img id="settings-preview-pic" class="profile-pic" style="width: 100px; height: 100px; margin-bottom: 15px; border: 3px solid #00a884;">
            <button class="btn" style="display: block; width: 100%;" onclick="document.getElementById('profile-upload').click()">Resim Seç</button>
            <input type="file" id="profile-upload" class="file-input" accept="image/*" onchange="handleProfileUpload(this)">
            <p style="text-align: left; margin-top: 20px;">Görünen İsim</p>
            <input type="text" id="edit-nick" placeholder="İsminiz...">
            <button class="btn" style="margin-top: 30px; width: 100%;" onclick="saveSettings()">Kaydet</button>
            <button class="btn btn-danger" style="margin-top: 15px; width: 100%;" onclick="logout()">Hesabı Sil</button>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <header>
            <div id="user-info" style="display: flex; align-items: center;"></div>
            <div class="settings-icon" onclick="openSettings()">⚙️</div>
        </header>

        <div class="stories" id="story-list">
            <div class="story-circle" onclick="document.getElementById('story-upload').click()">+ Durum</div>
            <input type="file" id="story-upload" class="file-input" accept="image/*,video/*" onchange="handleStoryUpload(this)">
        </div>

        <div class="search-box">
            <input type="number" id="search-id" placeholder="Numara ile kişi ekle..." onkeypress="handleSearch(event)">
        </div>

        <div class="list-container" id="contact-list"></div>
    </div>

    <div id="chat-screen" class="screen">
        <header>
            <button class="btn" onclick="goBack()">←</button>
            <div style="display: flex; align-items: center; flex: 1; margin-left: 10px;">
                <img id="chat-avatar" class="profile-pic" style="display:none; width:35px; height:35px;">
                <div>
                    <div id="chat-title">Sohbet</div>
                    <div id="conn-status" style="font-size: 10px; color: #8696a0;">Bekleniyor...</div>
                </div>
            </div>
        </header>
        <div id="chat-messages"></div>
        <div id="chat-footer" style="padding: 10px; background: #202c33; display: flex; gap: 10px;">
            <input type="text" id="msg-input" placeholder="Mesaj yazın...">
            <button class="btn" onclick="sendMsg()">➤</button>
        </div>
        <div id="blocked-notice" style="display:none; padding: 15px; text-align: center; background: #ea003833; color: #ea0038; font-weight: bold;">
            Bu kişiyi engellediniz.
        </div>
    </div>
</div>

<script>
    let myData = JSON.parse(localStorage.getItem('wos_me')) || null;
    let myFriends = JSON.parse(localStorage.getItem('wos_friends')) || [];
    let myStories = JSON.parse(localStorage.getItem('wos_stories')) || [];
    let currentChatIndex = null;
    let modalTargetIndex = null;
    let peer;
    let activeConn;
    let tempProfilePic = "";

    window.onload = () => {
        setTimeout(() => {
            if (myData) { initPeer(); loadMain(); } 
            else { showScreen('login-screen'); }
        }, 3000);
    };

    function startApp() {
        const number = document.getElementById('my-number').value;
        if (number.length !== 10) return alert("Numaranız 10 karakter olmalıdır!");
        myData = { nick: number, id: "WOS-" + number, pic: "" };
        localStorage.setItem('wos_me', JSON.stringify(myData));
        initPeer();
        loadMain();
    }

    function initPeer() {
        peer = new Peer(myData.id);
        peer.on('connection', (conn) => {
            activeConn = conn;
            conn.on('data', (data) => {
                const friend = myFriends.find(f => f.id === conn.peer);
                if(friend && friend.isBlocked) return; 
                if(data.type === 'profile_sync') { updateFriendProfile(conn.peer, data); } 
                else { handleIncomingMsg(conn.peer, data); }
            });
        });
    }

    // Modal Fonksiyonları
    function openFriendMenu(index) {
        modalTargetIndex = index;
        const friend = myFriends[index];
        document.getElementById('modal-title').innerText = friend.nick;
        document.getElementById('block-btn').innerText = friend.isBlocked ? "Engeli Kaldır" : "Engelle";
        document.getElementById('friend-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('friend-modal').style.display = 'none';
        modalTargetIndex = null;
    }

    function modalRename() {
        const friend = myFriends[modalTargetIndex];
        const newName = prompt("Yeni isim:", friend.nick);
        if (newName) {
            friend.nick = newName;
            save();
            renderContacts();
        }
        closeModal();
    }

    function modalToggleBlock() {
        const friend = myFriends[modalTargetIndex];
        friend.isBlocked = !friend.isBlocked;
        save();
        renderContacts();
        closeModal();
    }

    function renderContacts() {
        const list = document.getElementById('contact-list');
        list.innerHTML = myFriends.length === 0 ? '<p style="text-align:center; padding:20px; color:#8696a0;">Kişi yok.</p>' : '';
        myFriends.forEach((f, index) => {
            const imgHtml = f.pic ? `<img src="${f.pic}" class="profile-pic" style="width:35px; height:35px;">` : '<div class="profile-pic" style="width:35px; height:35px;"></div>';
            const blockedHtml = f.isBlocked ? '<span style="color:#ea0038; font-size:10px;"> (ENGELLİ)</span>' : '';
            list.innerHTML += `<div class="item">
                <div style="display:flex; align-items:center; flex:1;" onclick="openChat(${index})">
                    ${imgHtml}
                    <div><strong>${f.nick}${blockedHtml}</strong><br><span class="id-text">${f.id.replace("WOS-","")}</span></div>
                </div>
                <div class="more-icon" onclick="openFriendMenu(${index})">•••</div>
            </div>`;
        });
    }

    function openChat(index) {
        currentChatIndex = index;
        const f = myFriends[index];
        showScreen('chat-screen');
        document.getElementById('chat-title').innerText = f.nick;
        
        if(f.isBlocked) {
            document.getElementById('chat-footer').style.display = "none";
            document.getElementById('blocked-notice').style.display = "block";
        } else {
            document.getElementById('chat-footer').style.display = "flex";
            document.getElementById('blocked-notice').style.display = "none";
        }

        const avatar = document.getElementById('chat-avatar');
        if(f.pic) { avatar.src = f.pic; avatar.style.display = "block"; } else { avatar.style.display = "none"; }
        renderMessages();
        activeConn = peer.connect(f.id);
        setupConnEvents();
        setTimeout(() => { if(activeConn.open) activeConn.send({type: 'profile_sync', nick: myData.nick, pic: myData.pic}); }, 1000);
    }

    function sendMsg() {
        if(myFriends[currentChatIndex].isBlocked) return;
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text || !activeConn) return;
        activeConn.send(text);
        myFriends[currentChatIndex].messages.push({ text: text, type: 'sent' });
        save();
        renderMessages();
        input.value = '';
    }

    // --- DOKUNULMAYAN DİĞER MEKANİKLER ---
    function handleProfileUpload(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => { tempProfilePic = e.target.result; document.getElementById('settings-preview-pic').src = tempProfilePic; };
            reader.readAsDataURL(file);
        }
    }
    function handleStoryUpload(input) {
        const file = input.files[0];
        if (file) {
            const desc = prompt("Açıklama:");
            const reader = new FileReader();
            reader.onload = (e) => {
                const story = { owner: myData.nick, text: desc || "", media: e.target.result, type: file.type.startsWith('video') ? 'video' : 'image', time: Date.now() };
                myStories.unshift(story); localStorage.setItem('wos_stories', JSON.stringify(myStories)); renderStories();
            };
            reader.readAsDataURL(file);
        }
    }
    function openSettings() { document.getElementById('edit-nick').value = myData.nick; document.getElementById('settings-preview-pic').src = myData.pic || ""; tempProfilePic = myData.pic; showScreen('settings-screen'); }
    function saveSettings() { myData.nick = document.getElementById('edit-nick').value || myData.nick; myData.pic = tempProfilePic; localStorage.setItem('wos_me', JSON.stringify(myData)); loadMain(); showScreen('main-screen'); }
    function loadMain() { showScreen('main-screen'); const imgHtml = myData.pic ? `<img src="${myData.pic}" class="profile-pic">` : '<div class="profile-pic"></div>'; document.getElementById('user-info').innerHTML = `${imgHtml}<div><b>${myData.nick}</b><br><span class="id-text">${myData.id.replace("WOS-","")}</span></div>`; renderContacts(); renderStories(); }
    function handleSearch(event) { if (event.key === 'Enter') { const num = document.getElementById('search-id').value.trim(); if (num.length !== 10) return; const sid = "WOS-" + num; if (sid === myData.id) return; if (!myFriends.find(f => f.id === sid)) { myFriends.push({ id: sid, nick: num, messages: [], pic: "", isBlocked: false }); save(); } renderContacts(); document.getElementById('search-id').value = ''; } }
    function setupConnEvents() { activeConn.on('open', () => { document.getElementById('conn-status').innerText = "Çevrimiçi"; }); activeConn.on('data', (data) => { if(data.type === 'profile_sync') { updateFriendProfile(activeConn.peer, data); } else { handleIncomingMsg(activeConn.peer, data); } }); activeConn.on('close', () => { document.getElementById('conn-status').innerText = "Çevrimdışı"; }); }
    function updateFriendProfile(peerId, data) { const friend = myFriends.find(f => f.id === peerId); if(friend) { friend.pic = data.pic; save(); if(currentChatIndex !== null && myFriends[currentChatIndex].id === peerId) { const avatar = document.getElementById('chat-avatar'); if(data.pic) { avatar.src = data.pic; avatar.style.display = "block"; } } renderContacts(); } }
    function handleIncomingMsg(peerId, text) { const friend = myFriends.find(f => f.id === peerId); if(friend && !friend.isBlocked) { friend.messages.push({ text: text, type: 'received' }); save(); if(currentChatIndex !== null && myFriends[currentChatIndex].id === peerId) renderMessages(); } }
    function renderMessages() { const container = document.getElementById('chat-messages'); container.innerHTML = ''; myFriends[currentChatIndex].messages.forEach(m => { container.innerHTML += `<div class="bubble ${m.type}">${m.text}</div>`; }); container.scrollTop = container.scrollHeight; }
    function renderStories() { const list = document.getElementById('story-list'); list.innerHTML = `<div class="story-circle" onclick="document.getElementById('story-upload').click()">+ Durum</div>`; myStories.slice(0, 10).forEach(s => { const bg = s.type === 'image' ? `background-image: url('${s.media}')` : `background: #00a884`; list.innerHTML += `<div class="story-circle" style="${bg}" onclick="alert('${s.owner}: ${s.text}')"><div class="story-overlay">${s.owner}</div></div>`; }); }
    function save() { localStorage.setItem('wos_friends', JSON.stringify(myFriends)); }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function goBack() { currentChatIndex = null; showScreen('main-screen'); }
    function logout() { if(confirm("Tüm veriler silinecek?")) { localStorage.clear(); location.reload(); } }
</script>
<script src="script.js"></script>
</body>
</html>
